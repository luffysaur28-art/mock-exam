<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Knowledge Mock Exam</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-lighter: #c4b5fd;
            --bg: #f5f3ff;
            --card: #ffffff;
            --text: #1e1b4b;
            --text-secondary: #6b7280;
            --success: #10b981;
            --error: #ef4444;
            --border: #e5e7eb;
            --shadow: rgba(124, 58, 237, 0.1);
        }

        body.dark-mode {
            --bg: #110e2c;
            --card: #1e1b4b;
            --text: #f5f3ff;
            --text-secondary: #a78bfa;
            --primary: #a78bfa;
            --primary-light: #c4b5fd;
            --primary-lighter: #2d2a5e;
            --border: #312e81;
            --success: #34d399;
            --error: #f87171;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #app {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px var(--shadow), 0 8px 10px -6px var(--shadow);
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        #dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--primary-lighter);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 2px 5px var(--shadow);
        }

        #dark-mode-toggle:hover {
            background: var(--primary-light);
            transform: scale(1.1);
        }

        h1, h2, h3 {
            color: var(--primary);
            margin-bottom: 20px;
        }

        p {
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px var(--shadow);
        }

        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: var(--primary-lighter);
            cursor: not-allowed;
            transform: none;
            color: var(--text-secondary);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: var(--bg);
            color: var(--primary-light);
        }

        /* Screens */
        .screen {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Start Screen */
        #start-screen {
            text-align: center;
        }

        /* Quiz Screen */
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--primary-lighter);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary-light);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--text);
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .choice-btn {
            width: 100%;
            text-align: left;
            background: var(--bg);
            border: 2px solid transparent;
            padding: 15px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
            color: var(--text);
            display: flex;
            align-items: center;
        }

        .choice-btn:hover {
            border-color: var(--primary-lighter);
            background: var(--card);
        }

        .choice-btn.selected {
            border-color: var(--primary);
            background: var(--card);
            box-shadow: 0 4px 6px -1px var(--shadow);
        }

        .choice-letter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--primary-lighter);
            color: var(--primary);
            font-weight: 700;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .choice-btn.selected .choice-letter {
            background: var(--primary);
            color: white;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        /* Result Screen */
        .result-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(var(--primary) 0%, var(--primary-lighter) 0%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            position: relative;
        }

        .result-circle-inner {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .score-text {
            font-size: 36px;
            font-weight: 800;
            color: var(--primary);
        }

        .score-label {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
        }

        .results-summary {
            text-align: center;
            margin-bottom: 30px;
        }

        .wrong-items-container {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 30px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }

        .wrong-item {
            background: var(--bg);
            border-left: 4px solid var(--error);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .wrong-item-header {
            font-weight: 700;
            color: var(--error);
            margin-bottom: 5px;
            font-size: 14px;
        }

        .wrong-item p {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .correct-answer-text {
            color: var(--success);
            font-weight: 600;
        }

        .your-answer-text {
            color: var(--error);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            #app { padding: 20px; }
            .question-text { font-size: 16px; }
        }
    </style>
</head>
<body>

<div id="app">
    <button id="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>

    <!-- Start Screen -->
    <div id="start-screen" class="screen active">
        <h1>Product Knowledge Exam</h1>
        <p>Set A - 100 Items</p>
        <p style="color: var(--text-secondary);">Questions and choices are shuffled every time. You will see your score and the items you missed at the end.</p>
        <button class="btn" onclick="startExam()">Start Exam</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="screen">
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="question-header">
            <span id="question-number">Question 1 of 100</span>
            <span id="answered-count">0 / 100 Answered</span>
        </div>
        <div class="question-text" id="question-text"></div>
        <div class="choices-container" id="choices-container"></div>
        <div class="nav-buttons">
            <button class="btn btn-outline" id="prev-btn" onclick="prevQuestion()" disabled>Previous</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()">Next</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="screen">
        <h2 style="text-align: center;">Exam Finished!</h2>
        <div class="result-circle" id="result-circle">
            <div class="result-circle-inner">
                <span class="score-text" id="score-text">0%</span>
                <span class="score-label">Score</span>
            </div>
        </div>
        <div class="results-summary">
            <p><strong>Total Items:</strong> 100</p>
            <p><strong style="color: var(--success);">Correct:</strong> <span id="correct-count">0</span></p>
            <p><strong style="color: var(--error);">Incorrect:</strong> <span id="incorrect-count">0</span></p>
        </div>
        
        <div id="wrong-items-list" class="wrong-items-container"></div>

        <div style="text-align: center;">
            <button class="btn" onclick="startExam()">Retake Exam</button>
        </div>
    </div>
</div>

    let questions = [];
    let userAnswers = [];
    let currentIndex = 0;

    function parseData() {
        questions = []; // Reset array to prevent duplicates
        const lines = rawText.split('\n');
        let currentQ = null;
        let currentChoiceLabel = null;

        lines.forEach(line => {
            const qMatch = line.match(/^(\d+)\.\s+(.*)/);
            const cMatch = line.match(/^([A-D])\.\s+(.*)/);

            if (qMatch) {
                if (currentQ) questions.push(currentQ);
                currentQ = {
                    id: parseInt(qMatch[1]),
                    text: qMatch[2].trim(),
                    choices: [],
                    correctText: ''
                };
                currentChoiceLabel = null;
            } else if (cMatch && currentQ) {
                currentChoiceLabel = cMatch[1];
                currentQ.choices.push({
                    label: currentChoiceLabel,
                    text: cMatch[2].trim()
                });
            } else if (currentQ && line.trim() !== '') {
                // Multi-line append
                if (currentChoiceLabel) {
                    const lastChoice = currentQ.choices[currentQ.choices.length - 1];
                    lastChoice.text += ' ' + line.trim();
                } else {
                    currentQ.text += ' ' + line.trim();
                }
            }
        });

        if (currentQ) questions.push(currentQ);

        // Parse Answer Key
        const keyLines = rawKey.split('\n');
        const answerMap = {};
        
        keyLines.forEach(line => {
            const pairs = line.trim().split(/\s+/);
            for(let i=0; i < pairs.length; i+=2) {
                const id = parseInt(pairs[i]);
                const ans = pairs[i+1];
                if(!isNaN(id) && ans) {
                    answerMap[id] = ans;
                }
            }
        });

        // Assign correct text to questions
        questions.forEach(q => {
            let correctLabel = answerMap[q.id];
            
            // Fix anomaly where key says 'E' but options only go up to 'D'
            // Based on user instruction, 'E' is supposedly 'B'
            if (correctLabel === 'E') {
                correctLabel = 'B';
            }

            const correctChoice = q.choices.find(c => c.label === correctLabel);
            if (correctChoice) {
                q.correctText = correctChoice.text;
            }
        });
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function startExam() {
        parseData();
        shuffleArray(questions);
        userAnswers = new Array(questions.length).fill(null);
        currentIndex = 0;
        
        // Shuffle choices within each question
        questions.forEach(q => shuffleArray(q.choices));
        
        showScreen('quiz-screen');
        renderQuestion();
    }

    function renderQuestion() {
        const q = questions[currentIndex];
        
        document.getElementById('question-number').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
        document.getElementById('answered-count').textContent = `${userAnswers.filter(a => a !== null).length} / ${questions.length} Answered`;
        
        const progress = ((currentIndex + 1) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;

        document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.text}`;

        const container = document.getElementById('choices-container');
        container.innerHTML = '';

        const letters = ['A', 'B', 'C', 'D'];
        q.choices.forEach((choice, index) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            if (userAnswers[currentIndex] === choice.text) {
                btn.classList.add('selected');
            }
            btn.innerHTML = `<span class="choice-letter">${letters[index]}</span><span>${choice.text}</span>`;
            btn.onclick = () => selectAnswer(choice.text);
            container.appendChild(btn);
        });

        document.getElementById('prev-btn').disabled = currentIndex === 0;
        
        const nextBtn = document.getElementById('next-btn');
        if (currentIndex === questions.length - 1) {
            nextBtn.textContent = 'Finish Exam';
        } else {
            nextBtn.textContent = 'Next';
        }
    }

    function selectAnswer(answerText) {
        userAnswers[currentIndex] = answerText;
        renderQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    function nextQuestion() {
        if (userAnswers[currentIndex] === null) {
            alert("Please select an answer before proceeding.");
            return;
        }

        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            finishExam();
        }
    }

    function finishExam() {
        let correctCount = 0;
        const wrongItems = [];

        questions.forEach((q, index) => {
            if (userAnswers[index] === q.correctText) {
                correctCount++;
            } else {
                wrongItems.push({
                    id: index + 1,
                    question: q.text,
                    userAnswer: userAnswers[index],
                    correctAnswer: q.correctText
                });
            }
        });

        const score = Math.round((correctCount / questions.length) * 100);
        
        document.getElementById('score-text').textContent = `${score}%`;
        document.getElementById('correct-count').textContent = correctCount;
        document.getElementById('incorrect-count').textContent = questions.length - correctCount;

        const circle = document.getElementById('result-circle');
        circle.style.background = `conic-gradient(var(--primary) ${score}%, var(--primary-lighter) ${score}%)`;

        const wrongList = document.getElementById('wrong-items-list');
        wrongList.innerHTML = '';

        if (wrongItems.length > 0) {
            const header = document.createElement('h3');
            header.textContent = 'Missed Items';
            header.style.color = 'var(--error)';
            header.style.textAlign = 'left';
            header.style.marginBottom = '15px';
            wrongList.appendChild(header);

            wrongItems.forEach(item => {
                const div = document.createElement('div');
                div.className = 'wrong-item';
                div.innerHTML = `
                    <div class="wrong-item-header">Question ${item.id}</div>
                    <p>${item.question}</p>
                    <p class="your-answer-text">Your Answer: ${item.userAnswer || 'Unanswered'}</p>
                    <p class="correct-answer-text">Correct Answer: ${item.correctAnswer}</p>
                `;
                wrongList.appendChild(div);
            });
        } else {
            wrongList.innerHTML = '<p style="text-align: center; color: var(--success); font-weight: bold;">Perfect Score! Congratulations!</p>';
        }

        showScreen('result-screen');
    }
